name: networks-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r networks/requirements.txt
      - name: NPD endpoint file
        run: curl -sSL -o /tmp/ep.zst https://directory.cms.gov/downloads/03-Endpoint.ndjson.zst && ls -la /tmp/ep.zst
      - name: Discover MPF sources
        run: mkdir -p out && python networks/discover.py networks/contracts.json out/sources.json --npd /tmp/ep.zst 2>&1 | tee out/discover.log
      - name: Harvest MPF sources (4 parallel, 50 min)
        run: |
          python - <<'P'
          import json; s=json.load(open('out/sources.json')); m=[x for x in s if x['kind']=='mpf']; json.dump(m,open('out/mpf.json','w'))
          P
          for i in 0 1 2 3; do (timeout 3000 python networks/harvest.py out/mpf.json out/h --shard $i/4 > out/h$i.log 2>&1 || true) & done; wait; cat out/h?.log
      - name: UHC InsurancePlan census
        run: timeout 900 python tools/uhc_census.py https://flex.optum.com/fhirpublic/R4 > out/uhc_census.txt 2>&1 || true
      - name: Humana plan step with network sizes
        run: timeout 3000 python networks/fhir_crawl.py plan https://fhir.humana.com/api humana out/f > out/humana_plan.txt 2>&1 || true
      - name: Humana crawl speed test (15 min, 4 threads)
        run: |
          [ -f out/f/humana.plans.json ] && timeout 1000 python networks/fhir_crawl.py crawl https://fhir.humana.com/api humana out/f --shard 0/200 --budget 900 || true
      - name: Save results
        if: always()
        run: |
          mkdir -p /tmp/keep && cp -r out /tmp/keep/ ; find /tmp/keep -name "*.net.tsv" -size +2M -exec sh -c 'head -c 2000000 "$1" > "$1.head" && rm "$1"' _ {} \;
          find /tmp/keep -name "*.who.tsv" -exec sh -c 'head -200 "$1" > "$1.head" && rm "$1"' _ {} \;
          git config user.name "medicare4me-bot"; git config user.email "actions@users.noreply.github.com"
          git fetch origin results || true
          if ! git checkout -B results origin/results 2>/dev/null; then git checkout --orphan results; git rm -rf --cached . >/dev/null 2>&1 || true; fi
          rm -rf nettest && mkdir nettest && cp -r /tmp/keep/out/* nettest/
          git add nettest && git commit -m "network test $(date -u +%FT%TZ)" && git push -f origin results
